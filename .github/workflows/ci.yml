name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

  test-ubuntu-latest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
    - name: make
      # Fail build if there are warnings
      # build with TLS just for compilation coverage
      run: make REDIS_CFLAGS='-Werror' BUILD_TLS=yes
    - name: test
      run: |
        sudo apt-get install tcl8.6 tclx
        ./runtest --verbose --tags -slow --dump-logs
    - name: validate commands.def up to date
      run: |
        touch src/commands/ping.json
        make commands.def
        dirty=$(git diff)
        if [[ ! -z  $dirty ]]; then echo $dirty; exit 1; fi

  test-sanitizer-address:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: make
        # build with TLS module just for compilation coverage
        run: make SANITIZER=address REDIS_CFLAGS='-Werror -DDEBUG_ASSERTIONS -DREDIS_TEST' BUILD_TLS=module
      - name: testprep
        run: sudo apt-get install tcl8.6 tclx -y
      - name: test
        run: ./runtest --verbose --tags -slow --dump-logs

  test-redis-roaring-coexistence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake tcl8.6 tclx
      - name: Checkout pinned redis-roaring
        env:
          REDIS_ROARING_SHA: d56bd7ce1390a0ecab6dc2b0563ec041c741efc4
        run: |
          git init redis-roaring
          git -C redis-roaring remote add origin https://github.com/aviggiano/redis-roaring.git
          git -C redis-roaring fetch --depth 1 origin "$REDIS_ROARING_SHA"
          git -C redis-roaring checkout --detach FETCH_HEAD
          test "$(git -C redis-roaring rev-parse HEAD)" = "$REDIS_ROARING_SHA"
          git -C redis-roaring submodule update --init --depth 1 deps/CRoaring deps/hiredis
      - name: Build Redis with ASan and forced defrag
        run: make SANITIZER=address DEBUG_DEFRAG=force REDIS_CFLAGS='-Werror -DDEBUG_ASSERTIONS -DREDIS_TEST'
      - name: Build independently linked redis-roaring module
        run: |
          (cd redis-roaring/src && ../deps/CRoaring/amalgamation.sh)
          cmake -S redis-roaring -B redis-roaring/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DDISABLE_TESTS=ON \
            -DENABLE_ROARING_TESTS=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DUSE_REDIS_ALLOCATOR=ON
          cmake --build redis-roaring/build --target redis-roaring --parallel "$(nproc)"
          test -f redis-roaring/build/libredis-roaring.so
      - name: Test CRoaring allocator and symbol coexistence
        env:
          REDIS_ROARING_MODULE: ${{ github.workspace }}/redis-roaring/build/libredis-roaring.so
        run: ./runtest --single unit/bitmap-native --debug-defrag --verbose --dump-logs --clients 1

  test-gcra-bitmap-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y tcl8.6 tclx
      - name: Build legacy GCRA persistence support
        run: make -j"$(nproc)" OPTIMIZATION=-O0 REDIS_CFLAGS='-Werror -DDEBUG_ASSERTIONS -DREDIS_TEST -DENABLE_GCRA'
      - name: Verify legacy GCRA and bitmap persistence coexistence
        env:
          REQUIRE_GCRA_COMPAT: 1
        run: |
          nm src/redis-server | awk '$3 == "createGCRAObject" { found = 1 } END { exit !found }'
          ./runtest --single unit/bitmap-native --clients 1 --verbose --dump-logs \
            --only 'RDB type 29 remains reserved for legacy GCRA values' \
            --only 'legacy GCRA values coexist with bitmap command-form AOF rewrites'

  test-bitmap-big-endian:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Register the pinned emulator before checking out or executing PR code.
      - name: Install s390x emulator
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          image: tonistiigi/binfmt:latest@sha256:465d3fdd28d0f2b871ba4b4ec98bd183292e96167f00d9fd40bd249f8632d705
          platforms: s390x
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Build and test native bitmaps on s390x
        run: |
          docker run --rm --platform linux/s390x \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            s390x/debian:bookworm-slim@sha256:727cc7bb3f0ee4e8e20745bef240504b221f6ac589748e05f08b60c19d592929 \
            bash -euxo pipefail -c '
              test "$(dpkg --print-architecture)" = s390x
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential ca-certificates procps tcl8.6 tclx
              make -j2 OPTIMIZATION=-O0 MALLOC=libc SKIP_VEC_SETS=yes \
                REDIS_CFLAGS="-Werror -DDEBUG_ASSERTIONS -DREDIS_TEST"
              ./runtest --single unit/bitmap-native --clients 1 --verbose --dump-logs \
                --only "native bitmap DUMP uses its permanent type ID and bounded sparse format" \
                --only "native bitmap raw RDB payload round-trips across internal shapes" \
                --only "BITOP mixed benchmark-shaped dense operands match string results" \
                --only "native bitmap RDB round-trip with rdbcompression no" \
                --only "redis-check-rdb validates dumps containing native bitmaps"
            '

  build-debian-old:
    runs-on: ubuntu-latest
    container: debian:buster@sha256:2a0c1b9175adf759420fe0fbd7f5b449038319171eb76554bb76cbe172b62b42
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
    - name: make
      run: |
        sed -i 's|http://deb.debian.org/debian|http://archive.debian.org/debian|g' /etc/apt/sources.list
        sed -i 's|http://security.debian.org|http://archive.debian.org/debian-security|g' /etc/apt/sources.list
        apt-get update && apt-get install -y build-essential
        make REDIS_CFLAGS='-Werror'

  build-macos-latest:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
    - name: make
      # Fail build if there are warnings
      # build with TLS just for compilation coverage
      run: make REDIS_CFLAGS='-Werror' BUILD_TLS=yes

  build-32bit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
    - name: make
      run: |
        sudo apt-get update && sudo apt-get install libc6-dev-i386 gcc-multilib
        make REDIS_CFLAGS='-Werror' 32bit

  build-libc-malloc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
    - name: make
      run: make REDIS_CFLAGS='-Werror' MALLOC=libc

  build-centos-jemalloc:
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream9@sha256:0c9db821f54b244ec5e487056fe782e939db026240f52bc89e1d3a509dca7e8b
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
    - name: make
      run: |
        dnf -y install which gcc make
        make REDIS_CFLAGS='-Werror'

  build-old-chain-jemalloc:
    runs-on: ubuntu-latest
    container: ubuntu:20.04@sha256:c664f8f86ed5a386b0a340d981b8f81714e21a8b9c73f658c4bea56aa179d54a
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
    - name: make
      run: |
        apt-get update
        apt-get install -y gnupg2
        echo "deb http://archive.ubuntu.com/ubuntu/ xenial main" >> /etc/apt/sources.list
        echo "deb http://archive.ubuntu.com/ubuntu/ xenial universe" >> /etc/apt/sources.list
        apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 40976EAF437D05B5
        apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 3B4FE6ACC0B21F32
        apt-get update
        apt-get install -y make gcc-4.8
        update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-4.8 100
        make CC=gcc REDIS_CFLAGS='-Werror'
