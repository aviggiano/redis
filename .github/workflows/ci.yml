name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

  test-ubuntu-latest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: make
      # Fail build if there are warnings
      # build with TLS just for compilation coverage
      run: make REDIS_CFLAGS='-Werror' BUILD_TLS=yes
    - name: test
      run: |
        sudo apt-get install tcl8.6 tclx
        ./runtest --verbose --tags -slow --dump-logs
    - name: validate commands.def up to date
      run: |
        touch src/commands/ping.json
        make commands.def
        dirty=$(git diff)
        if [[ ! -z  $dirty ]]; then echo $dirty; exit 1; fi

  test-sanitizer-address:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: make
        # build with TLS module just for compilation coverage
        run: make SANITIZER=address REDIS_CFLAGS='-Werror -DDEBUG_ASSERTIONS -DREDIS_TEST' BUILD_TLS=module
      - name: testprep
        run: sudo apt-get install tcl8.6 tclx -y
      - name: test
        run: ./runtest --verbose --tags -slow --dump-logs

  test-redis-roaring-coexistence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake tcl8.6 tclx
      - name: Checkout pinned redis-roaring
        env:
          REDIS_ROARING_SHA: d56bd7ce1390a0ecab6dc2b0563ec041c741efc4
        run: |
          git init redis-roaring
          git -C redis-roaring remote add origin https://github.com/aviggiano/redis-roaring.git
          git -C redis-roaring fetch --depth 1 origin "$REDIS_ROARING_SHA"
          git -C redis-roaring checkout --detach FETCH_HEAD
          test "$(git -C redis-roaring rev-parse HEAD)" = "$REDIS_ROARING_SHA"
          git -C redis-roaring submodule update --init --depth 1 deps/CRoaring deps/hiredis
      - name: Build Redis with ASan and forced defrag
        run: make SANITIZER=address DEBUG_DEFRAG=force REDIS_CFLAGS='-Werror -DDEBUG_ASSERTIONS -DREDIS_TEST'
      - name: Build independently linked redis-roaring module
        run: |
          (cd redis-roaring/src && ../deps/CRoaring/amalgamation.sh)
          cmake -S redis-roaring -B redis-roaring/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DDISABLE_TESTS=ON \
            -DENABLE_ROARING_TESTS=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DUSE_REDIS_ALLOCATOR=ON
          cmake --build redis-roaring/build --target redis-roaring --parallel "$(nproc)"
          test -f redis-roaring/build/libredis-roaring.so
      - name: Test CRoaring allocator and symbol coexistence
        env:
          REDIS_ROARING_MODULE: ${{ github.workspace }}/redis-roaring/build/libredis-roaring.so
        run: ./runtest --single unit/bitmap-native --debug-defrag --verbose --dump-logs --clients 1

  build-debian-old:
    runs-on: ubuntu-latest
    container: debian:buster
    steps:
    - uses: actions/checkout@v6
    - name: make
      run: |
        sed -i 's|http://deb.debian.org/debian|http://archive.debian.org/debian|g' /etc/apt/sources.list
        sed -i 's|http://security.debian.org|http://archive.debian.org/debian-security|g' /etc/apt/sources.list
        apt-get update && apt-get install -y build-essential
        make REDIS_CFLAGS='-Werror'

  build-macos-latest:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - name: make
      # Fail build if there are warnings
      # build with TLS just for compilation coverage
      run: make REDIS_CFLAGS='-Werror' BUILD_TLS=yes

  build-32bit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: make
      run: |
        sudo apt-get update && sudo apt-get install libc6-dev-i386 gcc-multilib
        make REDIS_CFLAGS='-Werror' 32bit

  build-libc-malloc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: make
      run: make REDIS_CFLAGS='-Werror' MALLOC=libc

  build-centos-jemalloc:
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream9
    steps:
    - uses: actions/checkout@v6
    - name: make
      run: |
        dnf -y install which gcc make
        make REDIS_CFLAGS='-Werror'

  build-old-chain-jemalloc:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
    - uses: actions/checkout@v6
    - name: make
      run: |
        apt-get update
        apt-get install -y gnupg2
        echo "deb http://archive.ubuntu.com/ubuntu/ xenial main" >> /etc/apt/sources.list
        echo "deb http://archive.ubuntu.com/ubuntu/ xenial universe" >> /etc/apt/sources.list
        apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 40976EAF437D05B5
        apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 3B4FE6ACC0B21F32
        apt-get update
        apt-get install -y make gcc-4.8
        update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-4.8 100
        make CC=gcc REDIS_CFLAGS='-Werror'
