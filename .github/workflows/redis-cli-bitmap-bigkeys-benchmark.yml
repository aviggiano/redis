name: redis-cli bitmap bigkeys benchmark

on:
  pull_request:
    branches: [unstable]
    paths:
      - src/redis-cli.c
      - tests/integration/redis-cli.tcl
      - tests/benchmarks/redis-cli-bitmap-bigkeys.sh
      - .github/workflows/redis-cli-bitmap-bigkeys-benchmark.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git worktree add /tmp/redis-benchmark-base "$BASE_SHA"

      - name: Build base and head
        run: |
          make -C /tmp/redis-benchmark-base -j2
          make -j2

      - name: Measure bitmap cardinality scan cost
        run: |
          base_result=$(BITMAP_BENCH_PORT=16341 tests/benchmarks/redis-cli-bitmap-bigkeys.sh \
            /tmp/redis-benchmark-base/src/redis-server \
            /tmp/redis-benchmark-base/src/redis-cli)
          head_result=$(BITMAP_BENCH_PORT=16342 tests/benchmarks/redis-cli-bitmap-bigkeys.sh \
            "$PWD/src/redis-server" "$PWD/src/redis-cli")

          value() {
            sed -n "s/.*$1=\\([^ ]*\\).*/\\1/p"
          }
          base_ms=$(value elapsed_ms <<<"$base_result")
          head_ms=$(value elapsed_ms <<<"$head_result")
          base_total=$(value bitmap_total <<<"$base_result")
          head_total=$(value bitmap_total <<<"$head_result")
          head_count=$(value bitmap_count <<<"$head_result")
          head_unit=$(value unit <<<"$head_result")

          for metric in "$base_ms" "$head_ms" "$base_total" "$head_total" "$head_count"; do
            if [[ ! "$metric" =~ ^[0-9]+$ ]]; then
              echo "Could not parse benchmark result" >&2
              exit 1
            fi
          done

          delta_ms=$((head_ms - base_ms))
          {
            echo '## redis-cli native-bitmap big-key benchmark'
            echo
            echo '| Revision | Scan duration | Reported cardinality |'
            echo '|---|---:|---:|'
            echo "| PR base | ${base_ms} ms | ${base_total} |"
            echo "| PR head | ${head_ms} ms | ${head_total} set bits |"
            echo
            echo "Fixture: 20,000 native bitmap keys. Head-minus-base scan delta: ${delta_ms} ms."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "base: $base_result"
          echo "head: $head_result"

          if [[ "$head_count" != 20000 || "$head_total" != 20007 || "$head_unit" != set_bits ]]; then
            echo "Head did not report the expected native-bitmap cardinality" >&2
            exit 1
          fi

          # BITCOUNT adds real work, but it should stay within a generous bound
          # that catches accidental serial scans or other pathological changes.
          if (( head_ms > base_ms * 3 + 1000 )); then
            echo "Bitmap cardinality scan exceeded the CI performance budget" >&2
            exit 1
          fi
